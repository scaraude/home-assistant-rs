<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant - Temperature Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 30px;
            color: #58a6ff;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 8px 16px;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        select:hover, button:hover {
            border-color: #58a6ff;
        }

        .sensors {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .sensor-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }

        .sensor-name {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 10px;
        }

        .sensor-temp {
            font-size: 36px;
            font-weight: bold;
            color: #58a6ff;
            margin-bottom: 5px;
        }

        .sensor-meta {
            font-size: 12px;
            color: #8b949e;
            display: flex;
            gap: 15px;
        }

        .chart-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        canvas {
            max-width: 100%;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Temperature Monitor</h1>

        <div class="controls">
            <select id="timeRange">
                <option value="1">Last Hour</option>
                <option value="6">Last 6 Hours</option>
                <option value="24" selected>Last 24 Hours</option>
                <option value="168">Last Week</option>
            </select>
            <button onclick="refreshData()">🔄 Refresh</button>
        </div>

        <div id="sensors" class="sensors">
            <div class="loading">Loading sensors...</div>
        </div>

        <div class="chart-container">
            <canvas id="chart"></canvas>
        </div>
    </div>

    <script>
        let sensors = [];
        let chartData = {};
        let chart = null;

        // Fetch sensor list
        async function fetchSensors() {
            const res = await fetch('/api/sensors');
            sensors = await res.json();
            renderSensors();
        }

        // Fetch temperature readings
        async function fetchReadings() {
            const hours = document.getElementById('timeRange').value;
            const res = await fetch(`/api/readings?hours=${hours}`);
            const readings = await res.json();

            // Group by sensor
            chartData = {};
            readings.forEach(r => {
                if (!chartData[r.sensor_id]) {
                    chartData[r.sensor_id] = [];
                }
                chartData[r.sensor_id].push(r);
            });

            // Sort by timestamp
            Object.values(chartData).forEach(data => {
                data.sort((a, b) => a.timestamp - b.timestamp);
            });

            renderChart();
            updateSensorCards();
        }

        // Render sensor cards
        function renderSensors() {
            const container = document.getElementById('sensors');
            if (sensors.length === 0) {
                container.innerHTML = '<div class="loading">No sensors found</div>';
                return;
            }

            container.innerHTML = sensors.map(id => `
                <div class="sensor-card" id="sensor-${id}">
                    <div class="sensor-name">${id}</div>
                    <div class="sensor-temp">--°C</div>
                    <div class="sensor-meta">
                        <span>Humidity: --%</span>
                        <span>Battery: --%</span>
                    </div>
                </div>
            `).join('');
        }

        // Update sensor cards with latest data
        function updateSensorCards() {
            sensors.forEach(id => {
                const data = chartData[id];
                if (!data || data.length === 0) return;

                const latest = data[data.length - 1];
                const card = document.getElementById(`sensor-${id}`);
                if (!card) return;

                card.querySelector('.sensor-temp').textContent =
                    `${latest.temperature.toFixed(1)}°C`;

                const humidity = latest.humidity !== null ?
                    `${latest.humidity.toFixed(0)}%` : '--';
                const battery = latest.battery !== null ?
                    `${latest.battery}%` : '--';

                card.querySelector('.sensor-meta').innerHTML = `
                    <span>💧 ${humidity}</span>
                    <span>🔋 ${battery}</span>
                `;
            });
        }

        // TODO: Implement chart rendering
        // This is where you'll decide how to visualize the temperature history
        // Consider the trade-offs:
        // - Canvas API (lightweight, no dependencies)
        // - Chart.js (easy to use, ~200KB)
        // - Custom SVG (flexible, medium complexity)
        function renderChart() {
            // Your implementation here
            const canvas = document.getElementById('chart');
            const ctx = canvas.getContext('2d');

            // Set canvas size
            canvas.width = canvas.parentElement.clientWidth - 40;
            canvas.height = 400;

            // TODO: Draw the temperature history chart
            // Hint: chartData contains all sensor readings grouped by sensor_id
            // Each reading has: { sensor_id, temperature, humidity, battery, timestamp }
        }

        // Refresh data
        async function refreshData() {
            await fetchReadings();
        }

        // Auto-refresh every 30 seconds
        setInterval(refreshData, 30000);

        // Time range change handler
        document.getElementById('timeRange').addEventListener('change', refreshData);

        // Initial load
        (async () => {
            await fetchSensors();
            await fetchReadings();
        })();
    </script>
</body>
</html>
