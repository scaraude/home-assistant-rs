name: Deploy demo to GitHub Pages

# Builds the backend-less demo bundle (frontend/mock in-browser) and publishes
# it to GitHub Pages. The demo serves /api and /ws entirely client-side, so no
# server is involved. Live at https://scaraude.github.io/home-automation-rs/.

on:
  push:
    branches: [main, deployment/raspberry-pi]
    paths:
      - 'frontend/**'
      - '.github/workflows/demo.yml'
  # Allow manual redeploys from the Actions tab.
  workflow_dispatch:

# Grant the token the access GitHub Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one demo deployment at a time; let a newer push cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build demo
        run: npm run build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-demo

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
