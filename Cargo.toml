[workspace]
members = [
    "crates/core",          # scaraude Fork: MQTT, DB, HTTP, Events
    "crates/mcp-home",      # MCP Server (Pattern von mcp-loxone)
    "crates/ada-brain",     # lance-graph + ndarray Codebook
    "crates/voice",         # Vosk + Piper + ElevenLabs
    # "crates/tuya-local",  # Tuya Smart Life (wenn Stefan Tuya hat)
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AdaWorldAPI/home-automation-rs"
description = "Rust home automation with AI voice control and codebook brain"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rumqttc = "0.25"
rusqlite = { version = "0.37", features = ["bundled"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
